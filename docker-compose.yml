version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${DB_PASSWORD:-BudgetPlanner@2024!}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-BudgetPlanner@2024!}" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BudgetPlanner;User Id=sa;Password=${DB_PASSWORD:-BudgetPlanner@2024!};TrustServerCertificate=True;MultipleActiveResultSets=True"
      JwtSettings__SecretKey: "${JWT_SECRET:-super-secret-jwt-key-min-32-characters-here!}"
      JwtSettings__Issuer: "budget-planner"
      JwtSettings__Audience: "budget-planner-users"
      JwtSettings__AccessTokenMinutes: "60"
      JwtSettings__RefreshTokenDays: "7"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqldata:
